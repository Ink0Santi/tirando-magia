<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mensajes | Tirando Magia</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        🎵 Tirando Magia
    </a>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="buscar.html">Buscar músicos</a>
        <a href="mensajes.html" class="active">💬 Mensajes</a>
        <a href="perfil.html">Mi perfil</a>
    </nav>

</header>


<main class="messages-page">

    <div class="messages-container">

        <div class="messages-header">
            <div>
                <h1>💬 Mensajes</h1>
                <p>Hablá con otros músicos y empezá a armar proyectos.</p>
            </div>
        </div>

        <div id="messages-list" class="messages-list">

            <div class="messages-loading">
                Cargando conversaciones...
            </div>

        </div>

    </div>

</main>


<script>

const SUPABASE_URL = "https://buptjwmgwyeivjpcyvai.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_l9ibdIMfbbo8FJoyh3vs1w_-HJjSFI3";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


const messagesList = document.getElementById("messages-list");


function escapeHTML(text) {

    if (!text) return "";

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(date) {

    if (!date) return "";

    const d = new Date(date);

    return d.toLocaleDateString("es-AR", {
        day: "2-digit",
        month: "2-digit"
    });
}


async function cargarMensajes() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href = "login.html";

        return;
    }


    const userId = session.user.id;


    // Buscar conversaciones del usuario
    const {
        data: conversations,
        error
    } = await supabaseClient
        .from("conversations")
        .select(`
            id,
            user_one,
            user_two,
            created_at
        `)
        .or(
            `user_one.eq.${userId},user_two.eq.${userId}`
        )
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        messagesList.innerHTML = `
            <div class="messages-empty">
                <h2>No se pudieron cargar los mensajes</h2>
                <p>Intentá actualizar la página.</p>
            </div>
        `;

        return;
    }


    if (!conversations || conversations.length === 0) {

        messagesList.innerHTML = `
            <div class="messages-empty">

                <div class="empty-icon">💬</div>

                <h2>Todavía no tenés conversaciones</h2>

                <p>
                    Buscá músicos y empezá una conversación
                    para encontrar gente con quien tocar.
                </p>

                <a href="buscar.html" class="messages-button">
                    🎸 Buscar músicos
                </a>

            </div>
        `;

        return;
    }


    messagesList.innerHTML = "";


    for (const conversation of conversations) {

        const otherUserId =
            conversation.user_one === userId
                ? conversation.user_two
                : conversation.user_one;


        // Buscar perfil del otro músico
        const {
            data: profile
        } = await supabaseClient
            .from("profiles")
            .select(`
                id,
                name,
                instrument,
                profile_photo
            `)
            .eq("id", otherUserId)
            .maybeSingle();


        // Buscar último mensaje
        const {
            data: lastMessage
        } = await supabaseClient
            .from("messages")
            .select(`
                content,
                created_at,
                sender_id
            `)
            .eq("conversation_id", conversation.id)
            .order("created_at", {
                ascending: false
            })
            .limit(1)
            .maybeSingle();


        if (!profile) continue;


        const photoHTML = profile.profile_photo

            ? `
                <img
                    src="${escapeHTML(profile.profile_photo)}"
                    alt="Foto de ${escapeHTML(profile.name)}"
                >
              `

            : `
                <span>🎸</span>
              `;


        let preview = "Todavía no hay mensajes";


        if (lastMessage) {

            preview =
                lastMessage.sender_id === userId
                    ? "Vos: " + lastMessage.content
                    : lastMessage.content;
        }


        const conversationElement =
            document.createElement("a");


        conversationElement.className =
            "conversation-card";


        conversationElement.href =
            "chat.html?conversation=" +
            encodeURIComponent(conversation.id);


        conversationElement.innerHTML = `

            <div class="conversation-avatar">
                ${photoHTML}
            </div>

            <div class="conversation-info">

                <div class="conversation-top">

                    <h3>
                        ${escapeHTML(profile.name)}
                    </h3>

                    <span class="conversation-date">
                        ${
                            lastMessage
                                ? formatDate(lastMessage.created_at)
                                : ""
                        }
                    </span>

                </div>

                <p class="conversation-instrument">
                    ${escapeHTML(profile.instrument || "Músico")}
                </p>

                <p class="conversation-preview">
                    ${escapeHTML(preview)}
                </p>

            </div>

            <div class="conversation-arrow">
                →
            </div>

        `;


        messagesList.appendChild(
            conversationElement
        );
    }
}


cargarMensajes();

</script>

</body>
</html>
