<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi perfil | Tirando Magia</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- ==============================
         NAVBAR
         ============================== -->

    <header>
        <nav>

            <a href="index.html" class="logo">
                🎵 Tirando Magia
            </a>

            <div class="nav-links">

                <a href="index.html">
                    Inicio
                </a>

                <a href="buscar.html">
                    Buscar músicos
                </a>

                <a href="#">
                    Bandas
                </a>

                <a href="perfil.html">
                    Mi perfil
                </a>

                <a href="#" id="logout">
                    Cerrar sesión
                </a>

            </div>

        </nav>
    </header>


    <!-- ==============================
         PERFIL
         ============================== -->

    <main class="profile-page">

        <div class="profile-box">

            <h1>
                🎸 Creá tu perfil
            </h1>

            <p class="profile-subtitle">
                Contales a otros músicos quién sos y qué música hacés.
            </p>


            <!-- FOTO -->

            <div class="profile-photo-section">

                <div
                    class="profile-photo"
                    id="photo-preview"
                >
                    👤
                </div>

                <label for="profile-photo">
                    Cambiar foto
                </label>

                <input
                    type="file"
                    id="profile-photo"
                    accept="image/*"
                    hidden
                >

            </div>


            <!-- ==============================
                 FORMULARIO
                 ============================== -->

            <form id="profile-form">

                <!-- NOMBRE -->

                <div class="form-group">

                    <label for="name">
                        Nombre o nombre artístico
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Ej: Santiago"
                        required
                    >

                </div>


                <!-- INSTRUMENTO PRINCIPAL -->

                <div class="form-group">

                    <label for="instrument">
                        Instrumento principal
                    </label>

                    <select id="instrument" required>

                        <option value="">
                            Seleccioná un instrumento
                        </option>

                        <option value="Guitarra">
                            🎸 Guitarra
                        </option>

                        <option value="Bajo">
                            🎸 Bajo
                        </option>

                        <option value="Batería">
                            🥁 Batería
                        </option>

                        <option value="Voz">
                            🎤 Voz
                        </option>

                        <option value="Piano">
                            🎹 Piano
                        </option>

                        <option value="Teclado">
                            🎹 Teclado
                        </option>

                        <option value="Violín">
                            🎻 Violín
                        </option>

                        <option value="Saxofón">
                            🎷 Saxofón
                        </option>

                        <option value="Otro">
                            🎵 Otro
                        </option>

                    </select>

                </div>


                <!-- OTROS INSTRUMENTOS -->

                <div class="form-group">

                    <label for="secondary-instruments">
                        Otros instrumentos
                    </label>

                    <input
                        type="text"
                        id="secondary-instruments"
                        placeholder="Ej: Piano, guitarra acústica..."
                    >

                </div>


                <!-- NIVEL -->

                <div class="form-group">

                    <label for="level">
                        Nivel musical
                    </label>

                    <select id="level">

                        <option value="">
                            Seleccioná tu nivel
                        </option>

                        <option value="Principiante">
                            🌱 Principiante
                        </option>

                        <option value="Intermedio">
                            🎵 Intermedio
                        </option>

                        <option value="Avanzado">
                            🔥 Avanzado
                        </option>

                    </select>

                </div>


                <!-- GÉNEROS -->

                <div class="form-group">

                    <label for="genres">
                        Géneros musicales
                    </label>

                    <input
                        type="text"
                        id="genres"
                        placeholder="Ej: Rock, Punk, Metal..."
                    >

                    <small>
                        Separá los géneros con comas.
                    </small>

                </div>


                <!-- DESCRIPCIÓN -->

                <div class="form-group">

                    <label for="description">
                        Sobre vos
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        maxlength="500"
                        placeholder="Contá quién sos, qué música hacés y qué estás buscando..."
                    ></textarea>

                </div>


                <!-- BUSCA -->

                <div class="form-group">

                    <label for="looking-for">
                        ¿Qué estás buscando?
                    </label>

                    <select id="looking-for">

                        <option value="">
                            Seleccioná una opción
                        </option>

                        <option value="Formar una banda">
                            🎸 Formar una banda
                        </option>

                        <option value="Unirme a una banda">
                            🎤 Unirme a una banda
                        </option>

                        <option value="Buscar músicos">
                            🔎 Buscar músicos
                        </option>

                        <option value="Proyecto musical">
                            🎵 Proyecto musical
                        </option>

                        <option value="Solo conocer músicos">
                            🤝 Conocer músicos
                        </option>

                    </select>

                </div>


                <!-- UBICACIÓN -->

                <div class="form-group">

                    <label for="location">
                        📍 Zona donde estás
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Ej: Caballito, Buenos Aires"
                    >

                    <small>
                        Poné solamente una zona, barrio o ciudad. No hace falta poner tu dirección.
                    </small>

                </div>


                <!-- ARTISTAS -->

                <div class="form-group">

                    <label for="favorite-artists">
                        Artistas o bandas favoritas
                    </label>

                    <input
                        type="text"
                        id="favorite-artists"
                        placeholder="Ej: Green Day, Metallica, Cerati..."
                    >

                </div>


                <!-- INSTAGRAM -->

                <div class="form-group">

                    <label for="instagram">
                        Instagram
                    </label>

                    <input
                        type="text"
                        id="instagram"
                        placeholder="@tuusuario"
                    >

                </div>


                <!-- YOUTUBE -->

                <div class="form-group">

                    <label for="youtube">
                        YouTube / SoundCloud
                    </label>

                    <input
                        type="url"
                        id="youtube"
                        placeholder="https://..."
                    >

                </div>


                <!-- GUARDAR -->

                <button
                    type="submit"
                    class="button profile-save-button"
                    id="save-profile"
                >
                    💾 Guardar perfil
                </button>

            </form>


            <p id="profile-message"></p>

        </div>

    </main>


    <!-- ==============================
         FOOTER
         ============================== -->

    <footer>

        <p>
            © 2026 Tirando Magia — Encontrá tu banda.
        </p>

    </footer>


    <!-- ==============================
         JAVASCRIPT
         ============================== -->

    <script>

        // ==========================================
        // SUPABASE
        // ==========================================

        const SUPABASE_URL =
            "https://buptjwmgwyeivjpcyvai.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_l9ibdIMfbbo8FJoyh3vs1w_-HJjSFI3";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                }
            );


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const profileForm =
            document.getElementById("profile-form");

        const profileMessage =
            document.getElementById("profile-message");

        const saveButton =
            document.getElementById("save-profile");

        const photoInput =
            document.getElementById("profile-photo");

        const photoPreview =
            document.getElementById("photo-preview");


        // ==========================================
        // MENSAJES
        // ==========================================

        function showMessage(message) {

            profileMessage.textContent =
                message;

        }


        // ==========================================
        // CARGAR PERFIL
        // ==========================================

        async function cargarPerfil() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Error obteniendo sesión:",
                    error
                );

                showMessage(
                    "❌ No se pudo comprobar la sesión."
                );

                return;
            }


            const session =
                data.session;


            // ======================================
            // NO HAY SESIÓN
            // ======================================

            if (!session) {

                window.location.href =
                    "login.html";

                return;
            }


            console.log(
                "Usuario conectado:",
                session.user.email
            );


            // ======================================
            // BUSCAR PERFIL
            // ======================================

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("*")
                    .eq("id", session.user.id)
                    .maybeSingle();


            if (profileError) {

                console.error(
                    "Error cargando perfil:",
                    profileError
                );

                showMessage(
                    "❌ Error cargando perfil: " +
                    profileError.message
                );

                return;
            }


            // ======================================
            // PERFIL EXISTENTE
            // ======================================

            if (profile) {

                cargarDatosEnFormulario(profile);

                return;
            }


            // ======================================
            // DATOS VIEJOS
            // ======================================

            const metadata =
                session.user.user_metadata || {};

            cargarDatosEnFormulario(metadata);

        }


        // ==========================================
        // CARGAR DATOS
        // ==========================================

        function cargarDatosEnFormulario(data) {

            document.getElementById("name").value =
                data.name || "";


            document.getElementById("instrument").value =
                data.instrument || "";


            document.getElementById("secondary-instruments").value =
                data.secondary_instruments || "";


            document.getElementById("level").value =
                data.level || "";


            document.getElementById("genres").value =
                data.genres || "";


            document.getElementById("description").value =
                data.description || "";


            document.getElementById("looking-for").value =
                data.looking_for || "";


            document.getElementById("location").value =
                data.location || "";


            document.getElementById("favorite-artists").value =
                data.favorite_artists || "";


            document.getElementById("instagram").value =
                data.instagram || "";


            document.getElementById("youtube").value =
                data.youtube || "";


            // FOTO

            if (data.profile_photo) {

                photoPreview.innerHTML = `
                    <img
                        src="${data.profile_photo}"
                        alt="Foto de perfil"
                    >
                `;

            }

        }


        // ==========================================
        // VISTA PREVIA DE FOTO
        // ==========================================

        photoInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];

                if (!file) return;


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        photoPreview.innerHTML = `
                            <img
                                src="${event.target.result}"
                                alt="Foto de perfil"
                            >
                        `;

                    };


                reader.readAsDataURL(file);

            }
        );


        // ==========================================
        // GUARDAR PERFIL
        // ==========================================

        profileForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                saveButton.disabled =
                    true;

                saveButton.textContent =
                    "Guardando...";


                showMessage(
                    "Guardando perfil..."
                );


                // ==================================
                // SESIÓN
                // ==================================

                const {
                    data,
                    error: sessionError
                } =
                    await supabaseClient.auth.getSession();


                if (sessionError) {

                    console.error(
                        "Error de sesión:",
                        sessionError
                    );

                    showMessage(
                        "❌ Error de sesión: " +
                        sessionError.message
                    );

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "💾 Guardar perfil";

                    return;
                }


                const session =
                    data.session;


                if (!session) {

                    showMessage(
                        "❌ No hay una sesión iniciada."
                    );

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "💾 Guardar perfil";

                    return;
                }


                // ==================================
                // DATOS
                // ==================================

                const location =
                    document
                        .getElementById("location")
                        .value
                        .trim();


                // ==================================
                // GOOGLE MAPS
                // ==================================

                let mapsUrl = "";


                if (location) {

                    mapsUrl =
                        "https://www.google.com/maps/search/?api=1&query=" +
                        encodeURIComponent(location);

                }


                // ==================================
                // PERFIL
                // ==================================

                const profileData = {

                    id:
                        session.user.id,

                    name:
                        document
                            .getElementById("name")
                            .value
                            .trim(),

                    instrument:
                        document
                            .getElementById("instrument")
                            .value,

                    secondary_instruments:
                        document
                            .getElementById("secondary-instruments")
                            .value
                            .trim(),

                    level:
                        document
                            .getElementById("level")
                            .value,

                    genres:
                        document
                            .getElementById("genres")
                            .value
                            .trim(),

                    description:
                        document
                            .getElementById("description")
                            .value
                            .trim(),

                    looking_for:
                        document
                            .getElementById("looking-for")
                            .value,

                    location:
                        location,

                    maps_url:
                        mapsUrl,

                    favorite_artists:
                        document
                            .getElementById("favorite-artists")
                            .value
                            .trim(),

                    instagram:
                        document
                            .getElementById("instagram")
                            .value
                            .trim(),

                    youtube:
                        document
                            .getElementById("youtube")
                            .value
                            .trim(),

                    updated_at:
                        new Date().toISOString()

                };


                console.log(
                    "Datos del perfil:",
                    profileData
                );


                // ==================================
                // GUARDAR EN SUPABASE
                // ==================================

                const {
                    data: savedProfile,
                    error
                } =
                    await supabaseClient
                        .from("profiles")
                        .upsert(
                            profileData,
                            {
                                onConflict: "id"
                            }
                        )
                        .select()
                        .single();


                // ==================================
                // ERROR
                // ==================================

                if (error) {

                    console.error(
                        "ERROR COMPLETO DE SUPABASE:",
                        error
                    );

                    showMessage(
                        "❌ " + error.message
                    );

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "💾 Guardar perfil";

                    return;
                }


                // ==================================
                // ÉXITO
                // ==================================

                console.log(
                    "Perfil guardado:",
                    savedProfile
                );


                showMessage(
                    "✅ ¡Perfil guardado correctamente!"
                );


                saveButton.textContent =
                    "✓ Perfil guardado";


                setTimeout(
                    function () {

                        window.location.href =
                            "index.html";

                    },
                    1200
                );

            }
        );


        // ==========================================
        // CERRAR SESIÓN
        // ==========================================

        document
            .getElementById("logout")
            .addEventListener(
                "click",
                async function (event) {

                    event.preventDefault();


                    await supabaseClient
                        .auth
                        .signOut();


                    window.location.href =
                        "index.html";

                }
            );


        // ==========================================
        // INICIAR
        // ==========================================

        cargarPerfil();

    </script>

</body>

</html>
