<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Tirando Magia</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header" id="site-header"></header>

    <main class="auth-page">

        <div class="card auth-card">

            <h1>Bienvenido de nuevo 👋</h1>
            <p class="auth-sub">Iniciá sesión para seguir conectando con músicos y profes.</p>

            <form id="login-form" class="auth-form">

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="tuemail@ejemplo.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Tu contraseña"
                               autocomplete="current-password" required>
                        <button type="button" class="input-addon" data-toggle-password="password"
                                aria-label="Mostrar contraseña" aria-pressed="false">Ver</button>
                    </div>
                </div>

                <div id="login-message" role="alert" hidden></div>

                <button type="submit" class="btn btn-primary btn-block" id="login-button">
                    Iniciar sesión
                </button>

            </form>

            <div class="divider"><span>o</span></div>

            <p class="auth-alt">
                ¿Todavía no tenés cuenta? <a href="registro.html">Creala gratis</a>
            </p>

        </div>

    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>🎵 Tirando Magia</span>
            <span>© 2026 — Encontrá tu banda o tu profe.</span>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

    <script>
        const form = document.getElementById("login-form");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const button = document.getElementById("login-button");
        const message = document.getElementById("login-message");

        const next = TM.safeNext(new URLSearchParams(location.search).get("next"));

        TM.setupPasswordToggles();


        // Si ya hay sesión, no tiene sentido mostrar el login
        TM.getSession().then(session => {
            if (session) location.replace(next || "index.html");
        });

        if (next) {
            TM.showAlert(message, "Iniciá sesión para continuar.", "info");
        }


        form.addEventListener("submit", async event => {
            event.preventDefault();
            TM.showAlert(message, "");

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) {
                TM.showAlert(message, "Completá tu email y tu contraseña.");
                return;
            }

            TM.setBusy(button, true, "Iniciando sesión...");

            try {
                const { data, error } = await TM.db.auth.signInWithPassword({ email, password });

                if (error) throw error;

                const status = await TM.ensureProfile(data.user);

                button.textContent = "✓ Sesión iniciada";

                // Si el perfil se acaba de crear, lo mandamos a completarlo
                location.href = next || (status === "created" ? "perfil.html?bienvenida=1" : "index.html");

            } catch (error) {
                console.error("Error de login:", error);

                if ((error.message || "").toLowerCase().includes("email not confirmed")) {
                    localStorage.setItem("register_email", email);
                    TM.showAlert(
                        message,
                        'Todavía no verificaste tu email. <a href="verificar.html">Ingresá el código acá</a>.'
                    );
                } else {
                    TM.showAlert(message, TM.escapeHTML(TM.friendlyError(error)));
                }

                TM.setBusy(button, false);
            }
        });
    </script>

</body>

</html>
